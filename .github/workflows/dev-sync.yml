name: Dev Sync Check CI
on:
    push:
        branches: [main, dev]
    pull_request:
        branches: [main, dev]
jobs:
    check-frontend:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup Node.js 20
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: 'npm'
                  cache-dependency-path: 'package-lock.json'

            - name: Install dependencies
              run: npm ci

            - name: Type Check & Build Test
              run: |
                  npx tsc --noEmit || true
                  npm run build
